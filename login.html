<!-- Admin Login - Panel de Control -->
<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>3PayaresTV - Admin Access</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#000101",
                        "secondary-fixed-dim": "#95d3ba",
                        "tertiary-fixed-dim": "#ffb68e"
                    },
                    fontFamily: {
                        "headline": ["Epilogue"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                },
            },
        }
    </script>
    <style>
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-page {
            animation: pageEnter 0.8s ease-out forwards;
        }
        .bg-geometric { background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0); background-size: 40px 40px; }
        body { min-height: 100dvh; }
    </style>
</head>
<body class="bg-primary text-white overflow-hidden h-screen flex flex-col animate-page">
    <header class="fixed top-0 w-full bg-slate-950/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 z-50">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-slate-50">lock_person</span>
            <span class="font-headline font-bold tracking-widest text-xl text-slate-50 uppercase">EVENT LUXE</span>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center relative bg-geometric pt-16">
        <div class="absolute inset-0 bg-gradient-to-tr from-slate-950 via-primary to-slate-900 -z-10"></div>
        <div class="w-full max-w-md mx-4 px-1">
            <div class="relative bg-slate-900/40 backdrop-blur-2xl border border-white/5 rounded-xl p-10 shadow-2xl overflow-hidden">
                <div class="flex flex-col gap-8">
                    <div class="space-y-2">
                        <p class="font-body text-[10px] uppercase tracking-[0.3em] text-secondary-fixed-dim font-semibold">ACCESO ADMINISTRATIVO</p>
                        <h2 class="font-headline text-3xl font-bold text-slate-50 leading-none">Seguridad</h2>
                    </div>
                    <form class="space-y-6" onsubmit="window.location.href='panel.html'; return false;">
                        <input class="w-full bg-slate-800/40 border border-white/5 text-slate-50 px-5 py-4 rounded-lg focus:ring-1 focus:ring-secondary-fixed/50 transition-all font-mono tracking-widest text-lg" id="password" placeholder="••••••••" type="password" required/>
                        <button class="w-full bg-gradient-to-br from-slate-50 to-slate-300 text-slate-950 font-headline font-extrabold py-4 rounded-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                            ENTRAR <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
